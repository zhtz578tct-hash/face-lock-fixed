<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Flux Face-Lock</title></head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:20px">
<h2>Flux Face-Lock (InstantID)</h2>
<input type="file" id="file" accept="image/*">
<img id="preview" style="max-width:100%;margin:10px 0;display:none">
<input id="prompt" style="width:100%;padding:10px;margin:10px 0" value="same person wearing jeans and top, full body, park background, natural lighting, smiling">
<button id="btn" style="width:100%;padding:15px;background:#fff;color:#000;font-weight:bold">Generate Face-Lock</button>
<p id="status"></p>
<img id="result" style="max-width:100%;margin-top:20px">
<script>
const fileInput=document.getElementById('file'),preview=document.getElementById('preview'),btn=document.getElementById('btn'),status=document.getElementById('status'),result=document.getElementById('result');
let base64="";
fileInput.onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const img=await createImageBitmap(f);
  const canvas=document.createElement('canvas'); const max=640; let w=img.width,h=img.height;
  if(w>max||h>max){ if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;} }
  canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h);
  base64=canvas.toDataURL('image/jpeg',0.8);
  preview.src=base64; preview.style.display='block';
};
btn.onclick=async()=>{
  if(!base64) return alert('Select image first');
  status.textContent='Uploading to Replicate... Generating 20s...';
  btn.disabled=true;
  try{
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:base64,prompt:document.getElementById('prompt').value})});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    const out=d.output; const url=Array.isArray(out)?out[0]:out;
    result.src=url; status.textContent='Done!';
  }catch(err){ status.textContent='Error: '+err.message; }
  btn.disabled=false;
};
</script></body></html>

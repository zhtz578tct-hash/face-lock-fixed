<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flux Face-Lock (InstantID)</title>
<style>
body{font-family:system-ui;background:#000;color:#fff;max-width:600px;margin:20px auto;padding:16px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;font-size:16px;box-sizing:border-box}
button{background:#fff;color:#000;font-weight:700;cursor:pointer}
button.small{width:auto;padding:8px 14px;margin-right:8px;background:#222;color:#fff;border:1px solid #444}
#status{margin:12px 0;color:#0f0;word-break:break-word}
img{max-width:100%;border-radius:12px;margin-top:12px;display:none}
small{color:#aaa}
.row{display:flex;gap:8px}
</style>
</head>
<body>
<h2>Flux Face-Lock (InstantID)</h2>
<small>Crop photo to chest-to-head for perfect face-lock</small>
<input type="file" id="file" accept="image/*">
<div class="row">
<input type="text" id="prompt" value="same person wearing full-length blue jeans and blue t-shirt with sleeves, full body, park background, natural light, smiling" style="flex:1">
<button class="small" id="copyPrompt">Copy</button>
</div>
<button id="gen">Generate Face-Lock</button>
<div id="status"></div>
<div id="actions" style="display:none">
<button class="small" id="copyLink">Copy Image Link</button>
<button class="small" id="download">Download Image</button>
</div>
<img id="out">
<script>
const fileEl=document.getElementById('file');
const promptEl=document.getElementById('prompt');
const genEl=document.getElementById('gen');
const statusEl=document.getElementById('status');
const outEl=document.getElementById('out');
const actionsEl=document.getElementById('actions');
let lastUrl='';
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    statusEl.textContent='Copied!'; statusEl.style.color='#0f0';
    setTimeout(()=>{ statusEl.textContent='Done!'; },1500);
  }catch(e){ statusEl.textContent='Copy failed: '+e.message; statusEl.style.color='#f55'; }
}
document.getElementById('copyPrompt').onclick=()=>copyText(promptEl.value);
document.getElementById('copyLink').onclick=()=>copyText(lastUrl);
document.getElementById('download').onclick=()=>{
  if(!lastUrl) return;
  const a=document.createElement('a'); a.href=lastUrl; a.download='face-lock.jpg'; a.target='_blank'; a.click();
};
genEl.onclick=async()=>{
  const f=fileEl.files[0];
  if(!f){ statusEl.textContent='Choose image first'; statusEl.style.color='#f55'; return; }
  statusEl.style.color='#0f0'; statusEl.textContent='Processing image...'; outEl.style.display='none'; actionsEl.style.display='none';
  try{
    const bmp=await createImageBitmap(f);
    const canvas=document.createElement('canvas');
    const max=1024;
    let w=bmp.width,h=bmp.height;
    if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
    canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(bmp,0,0,w,h);
    const image=canvas.toDataURL('image/jpeg',0.85);
    statusEl.textContent='Generating (20-30s)...';
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,prompt:promptEl.value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||JSON.stringify(d));
    let url = Array.isArray(d.output)? d.output[0] : d.output;
    if(!url) throw new Error('No output');
    lastUrl=url; outEl.src=url; outEl.style.display='block'; actionsEl.style.display='block';
    statusEl.textContent='Done!'; statusEl.style.color='#0f0';
  }catch(err){
    statusEl.textContent='Error: '+err.message; statusEl.style.color='#f55';
  }
};
</script>

<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux Face-Lock (InstantID) - Fixed</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:20px;max-width:500px;margin:auto}
.upload{border:2px dashed #555;border-radius:16px;padding:30px;text-align:center;cursor:pointer}
textarea{width:100%;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;margin:15px 0}
button{width:100%;padding:16px;background:#fff;color:#000;border:0;border-radius:12px;font-weight:700;font-size:16px}
img{width:100%;border-radius:16px;margin-top:15px}
small{color:#888}
.slider-row{display:flex;gap:15px;margin:10px 0}
.slider-row div{flex:1}
input[type=range]{width:100%}
</style>
</head>
<body>
<h3>Flux Face-Lock (InstantID)</h3>
<small>Same face, new clothes/background. Fixed - no more pattern error.</small>

<div class="upload" id="drop" onclick="file.click()">
<div id="preview">Tap to upload face (front, clear light)</div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<textarea id="prompt" rows="3">same person wearing jeans and top, full body, park background, natural lighting, smiling</textarea>

<div class="slider-row">
<div>Face Strength<br><input type="range" id="fs" min="0.6" max="0.95" step="0.01" value="0.8"><small id="fsV">0.8</small></div>
<div>Control Scale<br><input type="range" id="cs" min="0.3" max="1" step="0.05" value="0.6"><small id="csV">0.6</small></div>
</div>

<button id="gen" onclick="generate()">Generate Face-Lock</button>
<div id="status" style="margin-top:12px;color:#aaa"></div>
<img id="result" style="display:none">

<script>
let imgData = "";
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const fs = document.getElementById('fs');
const cs = document.getElementById('cs');
fs.oninput = ()=>document.getElementById('fsV').textContent=fs.value;
cs.oninput = ()=>document.getElementById('csV').textContent=cs.value;

fileInput.addEventListener('change', async (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const bitmap = await createImageBitmap(f);
  const canvas = document.createElement('canvas');
  const MAX = 640;
  let w = bitmap.width, h = bitmap.height;
  if(w>h){ if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; } } else { if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; } }
  canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
  imgData = canvas.toDataURL('image/jpeg',0.7);
  preview.innerHTML = `<img src="${imgData}" style="max-height:300px">`;
});

async function generate(){
  if(!imgData){ alert('Please upload face photo first'); return; }
  const btn = document.getElementById('gen');
  const status = document.getElementById('status');
  btn.disabled=true; btn.textContent='Generating... 20s';
  status.textContent='Uploading to Replicate...';
  try{
    const res = await fetch('/api/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ 
        image: imgData, 
        prompt: document.getElementById('prompt').value,
        face_strength: parseFloat(fs.value),
        control_scale: parseFloat(cs.value)
      })
    });
    const data = await res.json();
    if(data.error){ status.textContent='Error: '+data.error; throw new Error(data.error); }
    document.getElementById('result').src = data.image;
    document.getElementById('result').style.display='block';
    status.textContent='Done!';
  }catch(err){
    status.textContent = err.message;
  }finally{
    btn.disabled=false; btn.textContent='Generate Face-Lock';
  }
}
</script>
